    <script>
      // Gracefully ignore HMR WebSocket disconnect messages in preview/iframe environment
      window.addEventListener('error', function (event) {
        if (event && event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('closed without opened') !== -1)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
