<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Arabic Calligraphy Letter Qaf & Qalam Nib Icon -->
  <g transform="translate(106, 80)">
    <!-- Traditional Calligraphy Qalam Pen Nib -->
    <path d="M 150 40 L 190 120 L 170 260 L 130 260 L 110 120 Z" fill="url(#gold)" />
    <path d="M 150 40 L 150 160" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    
    <!-- Arabic Qaf / Kalam curve -->
    <text x="150" y="320" font-family="'Amiri', 'Traditional Arabic', serif" font-size="200" fill="url(#gold)" text-anchor="middle" font-weight="bold">ق</text>
  </g>
</svg>
